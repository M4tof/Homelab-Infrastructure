<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .mood-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
        .mood-btn {
            background: none; border: 4px solid transparent; border-radius: 20%;
            cursor: pointer; padding: 5px; transition: all 0.2s;
        }
        .mood-btn img { width: 70px; height: 70px; filter: grayscale(60%); }
        .mood-btn.selected { border-color: #3498db; background: #1a1a1a; transform: scale(1.1); }
        .mood-btn.selected img { filter: grayscale(0%); }
        .comment-box {
            width: 90%; max-width: 450px; padding: 15px; border-radius: 12px;
            border: 1px solid #333; background: #1e1e1e; color: white; margin-bottom: 20px;
        }
        .submit-btn {
            background: #2ecc71; color: white; border: none; padding: 15px 50px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1em;
        }
        .alert {
            padding: 15px; background: #2ecc71; color: white; border-radius: 8px;
            width: 80%; max-width: 400px; margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>
    <h1>Mood Tracker</h1>
    {% with messages = get_flashed_messages() %}{% if messages %}
        {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
    {% endif %}{% endwith %}

    <form action="/submit" method="post">
        <input type="hidden" name="mood" id="selectedMood">
        <div class="mood-container">
            <button type="button" class="mood-btn" onclick="setMood('sad', this)"><img src="/static/sad.png"></button>
            <button type="button" class="mood-btn" onclick="setMood('upset', this)"><img src="/static/upset.png"></button>
            <button type="button" class="mood-btn" onclick="setMood('neutral', this)"><img src="/static/neutral.png"></button>
            <button type="button" class="mood-btn" onclick="setMood('pleased', this)"><img src="/static/pleased.png"></button>
            <button type="button" class="mood-btn" onclick="setMood('happy', this)"><img src="/static/happy.png"></button>
        </div>
        <textarea name="comment" class="comment-box" rows="3" placeholder="What's on your mind?"></textarea><br>
        <button type="submit" class="submit-btn">Submit Log</button>
    </form>
    <script>
        function setMood(val, element) {
            document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedMood').value = val;
        }
    </script>
</body>
</html>
